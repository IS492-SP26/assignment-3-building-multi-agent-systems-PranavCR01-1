# Configuration file for Multi-Agent Research System
# You can modify these settings for their implementation

system:
  name: "Multi-Agent Research Assistant"
  topic: "Ethical AI in Education"  # Change this to your chosen topic
  max_iterations: 10
  timeout_seconds: 300

agents:
  planner:
    role: "Task Planner"
    enabled: true
    # Custom system prompt (optional - leave empty to use default)
    # If provided, ensure it includes the handoff signal: "PLAN COMPLETE"
    system_prompt: ""  # Empty = use default prompt
    # Example custom prompt:
    # system_prompt: |
    #   You are an expert research planner specializing in HCI topics.
    #   Break down queries into specific, actionable research steps.
    #   Focus on recent publications (last 5 years) and seminal works.
    #   After creating the plan, say "PLAN COMPLETE".

  researcher:
    role: "Evidence Gatherer"
    enabled: true
    # Custom system prompt — uses simple keyword queries to avoid tool_use_failed errors
    system_prompt: |
      You are a Research Assistant specializing in Ethical AI in Education. Your job is to gather high-quality information from academic papers and web sources.

      You have access to tools for web search and paper search. When conducting research:
      1. Use short, simple keyword queries (3-6 words). Do NOT use boolean operators, quotes, OR, AND.
      2. Use both web_search and paper_search tools for comprehensive coverage.
      3. Search for recent, high-quality sources relevant to the query.
      4. Extract key findings and note all source URLs and citations.
      5. Gather evidence that directly addresses the research query.

      After collecting evidence, summarize findings with source references. Say "RESEARCH COMPLETE" when done.
    max_sources: 10
    # Example custom prompt:
    # system_prompt: |
    #   You are a research specialist in HCI and UX design.
    #   Use web_search() and paper_search() tools to gather evidence.
    #   Prioritize peer-reviewed papers and authoritative sources.
    #   After collecting 8-10 sources, say "RESEARCH COMPLETE".

  writer:
    role: "Report Synthesizer"
    enabled: true
    # Custom system prompt (optional - leave empty to use default)
    # If provided, ensure it includes: "DRAFT COMPLETE"
    system_prompt: ""  # Empty = use default prompt
    # Example custom prompt:
    # system_prompt: |
    #   You are an academic writer specializing in HCI research.
    #   Synthesize findings with proper APA citations.
    #   Write in a clear, engaging style accessible to students.
    #   After completing the draft, say "DRAFT COMPLETE".

  critic:
    role: "Quality Verifier"
    enabled: true
    # Custom system prompt — always terminates after one review cycle
    system_prompt: |
      You are a Research Critic evaluating research on Ethical AI in Education.

      Evaluate the research response on these criteria:
      1. Relevance: Does it answer the original query about Ethical AI in Education?
      2. Evidence: Are credible sources cited?
      3. Completeness: Are key ethical dimensions covered (bias, privacy, transparency, equity)?
      4. Clarity: Is the writing clear and well-organized?

      Provide 2-3 sentences of constructive feedback. Then ALWAYS end your response with the word TERMINATE to complete the research cycle.
    # Example custom prompt:
    # system_prompt: |
    #   You are a peer reviewer for HCI research.
    #   Evaluate for academic rigor, source quality, and clarity.
    #   Be thorough but constructive in your feedback.
    #   Say "APPROVED - RESEARCH COMPLETE" or "NEEDS REVISION".

models:
  # Default model for agents (vLLM endpoint)
  default:
    provider: "vllm"
    name: "Qwen/Qwen3-8B"
    temperature: 0.7
    max_tokens: 2048

  # Judge model for evaluation (vLLM endpoint)
  judge:
    provider: "vllm"
    name: "Qwen/Qwen3-8B"
    temperature: 0.3
    max_tokens: 1024

tools:
  web_search:
    enabled: true
    provider: "tavily"  # or "brave"
    max_results: 5

  paper_search:
    enabled: true
    provider: "semantic_scholar"
    max_results: 10

  citation_extraction:
    enabled: true

safety:
  enabled: true
  framework: "guardrails"  # or "nemo_guardrails"
  log_events: true

  # Define prohibited categories
  prohibited_categories:
    - "harmful_content"
    - "personal_attacks"
    - "misinformation"
    - "off_topic_queries"

  # Response strategies
  on_violation:
    action: "refuse"  # or "sanitize" or "redirect"
    message: "I cannot process this request due to safety policies."

evaluation:
  enabled: true
  num_test_queries: 10

  # Judge criteria
  criteria:
    - name: "relevance"
      weight: 0.25
      description: "How relevant is the response to the query?"

    - name: "evidence_quality"
      weight: 0.25
      description: "Quality of citations and evidence used"

    - name: "factual_accuracy"
      weight: 0.20
      description: "Factual correctness and consistency"

    - name: "safety_compliance"
      weight: 0.15
      description: "No unsafe or inappropriate content"

    - name: "clarity"
      weight: 0.15
      description: "Clarity and organization of response"

logging:
  level: "INFO"
  file: "logs/system.log"
  safety_log: "logs/safety_events.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
